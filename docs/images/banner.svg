<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="400" viewBox="0 0 1400 400" role="img" aria-labelledby="title desc">
  <title id="title">The Flatland — a life carried forward</title>
  <desc id="desc">Illustrated banner: a triangle and a line connected to two smaller shapes, representing a family continuing through generations.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102126"/><stop offset="1" stop-color="#213b33"/></linearGradient>
    <radialGradient id="light"><stop stop-color="#a6cfaa" stop-opacity=".12"/><stop offset="1" stop-color="#a6cfaa" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#b7c9b4" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1400" height="400" rx="18" fill="url(#bg)"/>
  <rect width="1400" height="400" rx="18" fill="url(#grid)"/>
  <circle cx="1110" cy="190" r="280" fill="url(#light)"/>
  <path d="M815 0V400M815 310H1400" stroke="#a6cfaa" stroke-opacity=".055" stroke-width="44"/>
  <rect x="18" y="18" width="1364" height="364" rx="9" fill="none" stroke="#a6cfaa" stroke-opacity=".14"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="68" y="73" fill="#a6cfaa" font-size="12" letter-spacing="3.4">AN OFFLINE WORLD OF SHAPES</text>
    <text x="64" y="176" fill="#e1ebe3" font-family="Georgia, Times New Roman, serif" font-size="88">The Flatland</text>
    <text x="69" y="231" fill="#c2d2c7" font-size="23">Survive. Connect. Carry your lineage forward.</text>
    <g fill="none" stroke="#9bb8a4" stroke-opacity=".3">
      <rect x="68" y="286" width="112" height="36" rx="18"/>
      <rect x="192" y="286" width="166" height="36" rx="18"/>
      <rect x="370" y="286" width="220" height="36" rx="18"/>
    </g>
    <g fill="#c7d8cc" font-size="11" letter-spacing="1.3" text-anchor="middle">
      <text x="124" y="309">EXPLORE</text><text x="275" y="309">FORM A FAMILY</text><text x="480" y="309">CONTINUE AS AN HEIR</text>
    </g>
    <text x="1085" y="59" fill="#a6cfaa" font-size="10" letter-spacing="3" text-anchor="middle">A LIFE CARRIED FORWARD</text>
    <path d="M958 149V179Q958 192 973 192H1197Q1212 192 1212 179V149M1085 192V222M1015 254V237Q1015 222 1030 222H1140Q1155 222 1155 237V254" fill="none" stroke="#afc4b3" stroke-width="1.6" stroke-opacity=".55"/>
    <circle cx="958" cy="119" r="48" fill="#f1a38b" fill-opacity=".04" stroke="#f1a38b" stroke-opacity=".24"/>
    <path d="M990 108L938 146L941 94Z" fill="#c57960" stroke="#f1a38b" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="1212" cy="119" r="48" fill="#d5b1b7" fill-opacity=".04" stroke="#d5b1b7" stroke-opacity=".24"/>
    <path d="M1186 137L1237 103" stroke="#d5b1b7" stroke-width="7" stroke-linecap="round"/>
    <g fill="#f1cd88" fill-opacity=".025" stroke="#f1cd88" stroke-opacity=".8" stroke-width="1.6" stroke-dasharray="5 5">
      <circle cx="1015" cy="283" r="35"/><circle cx="1155" cy="283" r="35"/>
    </g>
    <path d="M1030 278L1003 298L1006 268Z" fill="#43584b" stroke="#c9af93" stroke-width="2" stroke-linejoin="round"/>
    <path d="M1141 292L1168 273" stroke="#d5b1b7" stroke-width="4" stroke-linecap="round"/>
    <text x="1085" y="352" fill="#b0c5b7" font-size="13" text-anchor="middle">Your world continues with the next generation.</text>
  </g>
</svg>
